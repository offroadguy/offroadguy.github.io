<text x="62" y="241" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#4e6570">Packet / log / flow sources</text>
<path d="M359 226H382" stroke="#388884" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="389" y="173" width="312" height="106" rx="12" fill="white" stroke="#cfdddd"/><rect x="389" y="173" width="5" height="106" rx="2" fill="#087c75"/>
