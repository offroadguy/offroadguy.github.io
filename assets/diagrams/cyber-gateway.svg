<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 590" role="img"><title>Gateway deployment footprints</title><desc>Lightweight and larger deployments group the same operational responsibilities. Deployment options from a product design; published EPS/capacity targets are not treated as measured results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#388884" stroke-width="1.5"/></marker></defs><rect width="1440" height="590" rx="20" fill="#f5f7f7"/><path d="M0 8H1440" stroke="#087c75" stroke-width="16"/>
<text x="44" y="66" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#1b3442">Gateway deployment footprints</text>
<text x="44" y="104" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#4e6570">Lightweight and larger deployments group the same operational responsibilities</text>
<text x="44" y="151" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087c75">LIGHTWEIGHT FOOTPRINT</text>
<rect x="44" y="173" width="312" height="106" rx="12" fill="white" stroke="#cfdddd"/><rect x="44" y="173" width="5" height="106" rx="2" fill="#087c75"/>
