<text x="407" y="241" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#4e6570">Collection and control roles</text>
<path d="M704 226H727" stroke="#388884" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="734" y="173" width="312" height="106" rx="12" fill="white" stroke="#cfdddd"/><rect x="734" y="173" width="5" height="106" rx="2" fill="#087c75"/>
