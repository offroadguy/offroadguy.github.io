<path d="M1049 226H1072" stroke="#388884" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1079" y="173" width="312" height="106" rx="12" fill="white" stroke="#cfdddd"/><rect x="1079" y="173" width="5" height="106" rx="2" fill="#087c75"/>
<text x="1097" y="208" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1b3442">Cloud integration</text>
<text x="1097" y="241" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#4e6570">Hybrid connectivity / EC2</text>
<text x="44" y="341" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#087c75">LARGER FOOTPRINT</text>
