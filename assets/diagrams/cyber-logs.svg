<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 590" role="img"><title>Log collection test environments</title><desc>Same ingestion shape; distinct functional and performance configurations. Configuration differences are design context, not a claimed throughput improvement.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#388884" stroke-width="1.5"/></marker></defs><rect width="1440" height="590" rx="20" fill="#f5f7f7"/><path d="M0 8H1440" stroke="#087c75" stroke-width="16"/>
