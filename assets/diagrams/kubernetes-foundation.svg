<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101726"/><stop offset="1" stop-color="#090c12"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#75cbd1" stroke-width="1.5"/></marker></defs><rect width="1000" height="480" rx="18" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><title id="title">Kubernetes foundations for enterprise AI serving</title><desc id="desc">Separate application and GPU workload environments share engineering practices for deployment, capacity, network policy and observability. This is a conceptual view across platform configurations, not a depiction of every tool installed together.</desc><text x="28" y="42" font-size="26" fill="#f3f6ff" font-weight="700">KUBERNETES / THE FOUNDATION FOR AI SERVING</text><text x="28" y="75" font-size="20" fill="#80d4cd" font-weight="400">Co-owned platform lifecycle · Owned model onboarding tooling</text><rect x="28" y="103" width="456" height="154" rx="12" fill="#131e30" stroke="#334965"/><text x="50" y="138" font-size="25" fill="#f3f6ff" font-weight="700">Application Kubernetes</text><text x="50" y="174" font-size="20" fill="#bdc7da" font-weight="400">Ingestion &amp; inference services</text><text x="50" y="203" font-size="20" fill="#bdc7da" font-weight="400">GitOps onboarding · CPU / storage</text><text x="50" y="232" font-size="20" fill="#bdc7da" font-weight="400">Logs · latency · queue backlogs</text><rect x="516" y="103" width="456" height="154" rx="12" fill="#131e30" stroke="#334965"/><text x="538" y="138" font-size="25" fill="#f3f6ff" font-weight="700">GPU Kubernetes</text><text x="538" y="174" font-size="20" fill="#bdc7da" font-weight="400">Model serving on NVIDIA GPUs</text><text x="538" y="203" font-size="20" fill="#bdc7da" font-weight="400">Weight staging · vLLM runtime</text><text x="538" y="232" font-size="20" fill="#bdc7da" font-weight="400">Setup · upgrades · patches</text><rect x="914" y="123" width="48" height="38" rx="5" fill="#173330" stroke="#76d3c8"/><rect x="924" y="132" width="28" height="20" rx="2" fill="#213e3a" stroke="#76d3c8"/><path d="M922 118v5M922 161v5" stroke="#76d3c8" stroke-width="2"/><path d="M932 118v5M932 161v5" stroke="#76d3c8" stroke-width="2"/><path d="M942 118v5M942 161v5" stroke="#76d3c8" stroke-width="2"/><path d="M952 118v5M952 161v5" stroke="#76d3c8" stroke-width="2"/><path d="M909 132h5M962 132h5" stroke="#76d3c8" stroke-width="2"/><path d="M909 142h5M962 142h5" stroke="#76d3c8" stroke-width="2"/><path d="M909 152h5M962 152h5" stroke="#76d3c8" stroke-width="2"/><path d="M256 257v32H744v-32M500 289v21" fill="none" stroke="#75cbd1" stroke-width="2"/><text x="28" y="313" font-size="20" fill="#80d4cd" font-weight="700">SHARED ENGINEERING PRACTICES</text><rect x="28" y="329" width="224" height="102" rx="12" fill="#111b29" stroke="#2e425a"/><text x="42" y="357" font-size="22" fill="#f3f6ff" font-weight="700">Deployment</text><text x="42" y="386" font-size="20" fill="#bdc7da" font-weight="400">Helm · Kustomize</text><text x="42" y="413" font-size="20" fill="#bdc7da" font-weight="400">FluxCD / Argo CD</text><rect x="272" y="329" width="224" height="102" rx="12" fill="#111b29" stroke="#2e425a"/><text x="286" y="357" font-size="22" fill="#f3f6ff" font-weight="700">Capacity</text><text x="286" y="386" font-size="20" fill="#bdc7da" font-weight="400">Karpenter · KEDA</text><text x="286" y="413" font-size="20" fill="#bdc7da" font-weight="400">HPA · GPU Operator</text><rect x="516" y="329" width="224" height="102" rx="12" fill="#111b29" stroke="#2e425a"/><text x="530" y="357" font-size="22" fill="#f3f6ff" font-weight="700">Network &amp; policy</text><text x="530" y="386" font-size="20" fill="#bdc7da" font-weight="400">Mesh · CNI · ingress</text><text x="530" y="413" font-size="20" fill="#b